<title>Polyglot AI – Language Teacher</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="AI language teacher with voice: conversation, lessons, review and progress tracking.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b1020;--sf:#141b30;--sf2:#1c2540;--bd:#2a3556;--tx:#e6ebf7;--mut:#8f9bb8;--ac:#3b82f6;--ac2:#2563eb;--ok:#22c55e;--bad:#ef4444;--warn:#facc15;--nav:62px}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans CJK SC","Noto Sans JP","Noto Sans KR",sans-serif;font-size:16px}
body{display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--bd)}
header img{width:30px;height:30px;border-radius:8px}
header h1{font-size:18px;flex:1;font-weight:700}
main{flex:1;min-height:0;position:relative}
.screen{display:none;position:absolute;inset:0;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.screen.active{display:block}
#s-chat.active{display:flex;flex-direction:column;padding:0}
nav{display:flex;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--sf);border-top:1px solid var(--bd)}
nav button{flex:1;background:none;border:none;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav button span.ic{font-size:21px}
nav button.on{color:var(--ac)}
h2{font-size:20px;margin-bottom:10px}
h3{font-size:14px;color:var(--mut);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
button,select,input,textarea{font:inherit;color:var(--tx);border-radius:10px;border:1px solid var(--bd);background:var(--sf2);padding:10px 12px;outline:none}
input,select,textarea{width:100%}
textarea{resize:none}
button{cursor:pointer;background:var(--ac);border:none;font-weight:600}
button:active{background:var(--ac2)}
button:disabled{opacity:.45}
button.sec{background:var(--sf2);border:1px solid var(--bd)}
button.danger{background:var(--bad)}
button.ok{background:var(--ok);color:#052e12}
button.sm{padding:6px 10px;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;font-weight:600;font-size:15px;color:var(--tx)}
.mode .ic{font-size:28px}
.bar{height:10px;background:var(--sf2);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ok))}
.mut{color:var(--mut);font-size:14px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.sw input{width:auto;transform:scale(1.3)}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:92%;padding:10px 13px;border-radius:14px;line-height:1.5;word-wrap:break-word}
.bub.user{align-self:flex-end;background:var(--ac2);border-bottom-right-radius:4px;white-space:pre-wrap}
.bub.ai{align-self:flex-start;background:var(--sf2);border-bottom-left-radius:4px}
.bub.note{align-self:center;background:none;color:var(--mut);font-size:14px;text-align:center}
.seg{padding:4px 0}
.seg+.seg{border-top:1px dashed var(--bd);margin-top:4px}
.seg .tx{font-size:18px}
.seg.explanation .tx,.seg.correction .tx{font-size:15px;color:#c9d3ee}
.seg .rd{color:var(--warn);font-size:14px}
.seg .tr{color:var(--mut);font-size:14px}
.seg .ctl{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.ctl button{padding:2px 8px;font-size:14px;background:var(--bd)}
.corr{margin-top:8px;padding:8px;border-left:3px solid var(--warn);background:#2a2a1a;border-radius:6px;font-size:14px}
.corr s{color:var(--bad)}.corr b{color:var(--ok)}
.chip{display:inline-block;padding:3px 9px;border-radius:12px;background:var(--bd);font-size:13px;margin:2px 4px 2px 0}
.chk{font-size:14px;margin:4px 0}.chk.d{color:var(--ok)}
#inbar{padding:8px 10px;background:var(--sf);border-top:1px solid var(--bd)}
#inbar .tools{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
#inbar .box{display:flex;gap:8px;align-items:flex-end}
#inbar textarea{flex:1;min-height:44px;max-height:120px}
#mic{width:58px;height:58px;border-radius:50%;font-size:26px;padding:0;flex:none}
#mic.on{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(239,68,68,.25)}}
#send{height:44px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;overflow-y:auto;padding:20px}
.modal>div{background:var(--sf);border:1px solid var(--bd);border-radius:16px;max-width:520px;margin:20px auto;padding:18px}
.li{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;background:var(--sf2)}
.li .gr{flex:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:20px;z-index:80;display:none;max-width:90%;text-align:center;font-size:14px}
.fc{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.fc .big{font-size:28px;font-weight:700}
.opt{display:block;width:100%;text-align:left;margin-bottom:6px;background:var(--sf2);border:1px solid var(--bd)}
.opt.good{background:#14532d;border-color:var(--ok)}.opt.bad{background:#7f1d1d;border-color:var(--bad)}
.ex{margin-top:10px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--sf)}
.diff .m{color:var(--ok)}.diff .x{color:var(--bad);text-decoration:underline}.diff .e{color:var(--bad);text-decoration:line-through}
.wk{display:flex;align-items:flex-end;gap:8px;height:110px}
.wk div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.wk i{display:block;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
.big2{font-size:34px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats .card{margin:0;padding:10px}
</style>
</head>
<body>
<header><img src="icon-192.png" alt=""><h1>Polyglot AI</h1><button class="sm ok" id="btn-install" style="display:none" data-i="install"></button></header>
<main>
 <section class="screen active" id="s-home"></section>
 <section class="screen" id="s-chat">
  <div class="row" style="padding:8px 12px;background:var(--sf);border-bottom:1px solid var(--bd)">
   <button class="sm sec" id="btn-sessions" data-i="sessions"></button>
   <button class="sm sec" id="btn-newsess" data-i="newSession"></button>
   <button class="sm sec" id="btn-end" data-i="endSession" style="margin-left:auto"></button>
  </div>
  <div id="chk" style="padding:0 12px"></div>
  <div id="msgs"></div>
  <div id="inbar">
   <div class="tools">
    <button class="sm sec" id="btn-spk"></button>
    <button class="sm sec" id="btn-hf"></button>
    <button class="sm sec" id="btn-stop">🔇</button>
   </div>
   <div class="box">
    <textarea id="inp" rows="1" data-ph="typeMsg"></textarea>
    <button id="mic" title="🎤">🎤</button>
    <button id="send" data-i="send"></button>
   </div>
  </div>
 </section>
 <section class="screen" id="s-tool"></section>
 <section class="screen" id="s-review"></section>
 <section class="screen" id="s-progress"></section>
 <section class="screen" id="s-settings"></section>
</main>
<nav>
 <button data-go="home"><span class="ic">🏠</span><span data-i="home"></span></button>
 <button data-go="chat"><span class="ic">💬</span><span data-i="chat"></span></button>
 <button data-go="review"><span class="ic">🧠</span><span data-i="review"></span></button>
 <button data-go="progress"><span class="ic">📈</span><span data-i="progress"></span></button>
 <button data-go="settings"><span class="ic">⚙️</span><span data-i="settings"></span></button>
</nav>
<div id="toast"></div>
<div id="modal-host"></div>

const DEF={key:'',model:'gemini-3.6-flash',temp:0.7,ui:'en',native:'en',targets:['es'],active:'es',corr:'each',voices:{},rate:1,autoRead:true,showRead:true,showTrans:true,autoSend:true,speakMode:'target',hf:false,welcomed:false};
let S=Object.assign({},DEF);
try{Object.assign(S,JSON.parse(localStorage.getItem('pl_settings')||'{}'))}catch(e){}
const saveS=()=>{try{localStorage.setItem('pl_settings',JSON.stringify(S))}catch(e){}};
/* per-language learning profile: level, goal, daily goal, level estimate, session count */
const PDEF={level:'A2',goal:'',daily:15,levelEst:null,sessCount:0};
function P(lang){lang=lang||S.active;if(!S.prof)S.prof={};if(!S.prof[lang])S.prof[lang]=Object.assign({},PDEF);return S.prof[lang]}
function migrateSettings(){
 const old={};['level','goal','daily','levelEst','sessCount'].forEach(k=>{if(k in S){old[k]=S[k];delete S[k]}});
 if(!Object.keys(old).length)return;
 [...new Set([...(S.targets||[]),S.active])].forEach(l=>{const p=P(l);['level','goal','daily'].forEach(k=>{if(old[k]!==undefined)p[k]=old[k]});
  if(old.levelEst&&old.levelEst.lang===l)p.levelEst=old.levelEst;if(l===S.active&&old.sessCount)p.sessCount=old.sessCount});
 saveS();
}

const INTERVALS=[1,3,7,14,30];

 if(ok){v.hits++;v.reps++;v.stage=Math.min(v.stage+1,5);v.interval=INTERVALS[v.stage-1];v.due=addDays(today,v.interval)}
 else{v.miss++;v.stage=0;v.interval=1;v.due=addDays(today,1)}

 if(old){let ch=false;for(const k of['reading','translation','example'])if(!old[k]&&nv[k]){old[k]=nv[k];ch=true}if(ch)await dbPut('vocab',old);return false}
 await dbPut('vocab',nv);return true;

function calcStreak(act,today=todayISO()){

 while((m[d]||0)>=60){n++;d=addDays(d,-1)}

const normTxt=s=>String(s||'').toLowerCase().replace(/[\p{P}\p{S}]/gu,' ').replace(/\s+/g,' ').trim();
function tokens(s,lang){const n=normTxt(s);return ASIAN.includes(lang)?[...n.replace(/\s/g,'')]:(n?n.split(' '):[])}
function diffTokens(exp,got){
 const n=exp.length,m=got.length,L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=exp[i]===got[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 const out=[];let i=0,j=0;
 while(i<n&&j<m){if(exp[i]===got[j]){out.push({t:'m',v:exp[i]});i++;j++}else if(L[i+1][j]>=L[i][j+1]){out.push({t:'x',v:exp[i]});i++}else{out.push({t:'e',v:got[j]});j++}}
 while(i<n)out.push({t:'x',v:exp[i++]});while(j<m)out.push({t:'e',v:got[j++]});
 return out;
}

/* ===== VOICE: TTS ===== */
let curSid=null,speaking=false,ttsToken=0,warnedVoice={};
const hasTTS='speechSynthesis' in window;
function voicesFor(code){const p=lc2(code);return hasTTS?speechSynthesis.getVoices().filter(v=>lc2(v.lang)===p):[]}
function pickVoice(code){
 const vs=speechSynthesis.getVoices(),nm=s=>s.replace('_','-').toLowerCase(),want=nm(bcp(code));
 return vs.find(v=>v.name===S.voices[code])||vs.find(v=>nm(v.lang)===want)||vs.find(v=>lc2(v.lang)===lc2(code))||null;
}
function stopSpeak(){ttsToken++;speaking=false;if(hasTTS)speechSynthesis.cancel()}
function cleanForSpeech(s){return String(s||'').replace(/```[\s\S]*?```/g,' ').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/https?:\/\/\S+/g,'').replace(/[*_#`>~|]/g,'').replace(/\s+/g,' ').trim()}
function splitText(s){const fr=s.match(/[^.!?…。！？]+[.!?…。！？]*\s*/g)||[s],out=[];let cur='';for(const f of fr){if(cur&&(cur+f).length>220){out.push(cur);cur=f}else cur+=f}if(cur)out.push(cur);return out}
/* items: [{text,lang}] ; mult: speed multiplier (slow button) */
function speak(items,onEnd,mult=1){
 if(!hasTTS){onEnd&&onEnd();return}
 stopSpeak();
 const q=[];
 items.forEach(it=>{const lang=LANGS[lc2(it.lang)]?lc2(it.lang):S.active;splitText(cleanForSpeech(it.text)).forEach(p=>{if(p)q.push({text:p,lang})})});
 if(!q.length){onEnd&&onEnd();return}
 const tk=++ttsToken;let i=0;speaking=true;
 const next=()=>{
  if(tk!==ttsToken)return;
  if(i>=q.length){speaking=false;onEnd&&onEnd();return}
  const c=q[i++],u=new SpeechSynthesisUtterance(c.text);
  u.lang=bcp(c.lang);u.rate=Math.min(2,Math.max(0.5,S.rate*mult));
  const v=pickVoice(c.lang);
  if(v)u.voice=v;
  else if(!warnedVoice[c.lang]&&speechSynthesis.getVoices().length){warnedVoice[c.lang]=1;toast(t('noVoice'),6000)}
  u.onend=next;u.onerror=()=>{if(tk===ttsToken){speaking=false;onEnd&&onEnd()}};
  speechSynthesis.speak(u);
 };
 setTimeout(next,60);
}

async function gemini(contents,o={}){
 if(!S.key)throw new Error(t('noKey'));
 const url=`https://generativelanguage.googleapis.com/v1beta/models/${S.model}:generateContent`;
 const body={contents:typeof contents==='string'?[{role:'user',parts:[{text:contents}]}]:contents};
 if(o.system)body.systemInstruction={parts:[{text:o.system}]};
 const cfg={temperature:o.temp??S.temp};if(o.json)cfg.responseMimeType='application/json';
 body.generationConfig=cfg;
 const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.key},body:JSON.stringify(body)});
 if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||('API '+r.status))}
 const d=await r.json();
 const txt=(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
 if(!txt)throw new Error('Empty response');
 return txt;
}
function extractJSON(s){
 s=String(s).replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
 try{return JSON.parse(s)}catch(e){}
 const a=s.indexOf('{'),b=s.lastIndexOf('}');
 if(a>=0&&b>a){try{return JSON.parse(s.slice(a,b+1))}catch(e){}}
 return null;
}
async function geminiJSON(contents,o={}){
 for(let i=0;i<2;i++){
  const raw=await gemini(contents,Object.assign({},o,{json:true}));
  const j=extractJSON(raw);
  if(j&&typeof j==='object')return{json:j,raw};
  if(i===1)return{json:null,raw};
 }
}

  const pick=document.createElement('div'),pool=document.createElement('div');pick.style.cssText='min-height:42px;padding:6px;border:1px dashed var(--bd);border-radius:8px;margin-bottom:8px';

  const chk=document.createElement('button');chk.textContent=t('check');chk.style.marginTop='8px';
  chk.onclick=()=>{if(done)return;finish(normNS(chosen.map(b=>b.textContent).join(' '))===normNS(ex.answer));chk.disabled=true};

 }else{
  const i=document.createElement('input');i.autocomplete='off';i.autocapitalize='off';i.spellcheck=false;
  const chk=document.createElement('button');chk.textContent=t('check');chk.style.marginTop='8px';

 }
}

  r=o.json;
 }catch(e){toast(t('error')+e.message,4000)}
 s.ended=true;await dbPut('sessions',s);const pf=P(s.lang);pf.sessCount=(pf.sessCount||0)+1;saveS();
 if(r){
  if(S.corr==='end')for(const c of r.corrections||[])if(c&&c.corrected)await dbPut('errors',{lang:s.lang,category:c.category||'other',original:c.original||'',corrected:c.corrected,explanation:c.explanation||'',ts:Date.now()});
  for(const v of r.new_vocab||[])if(v&&v.term)await addVocab(s.lang,v.term,v);
  const props=(r.memory_proposals||[]).filter(Boolean).map(String);
  const h=modal(`<h2>${esc(t('sessionSummary'))}</h2><div>${esc(r.summary||'')}</div>`
   +(S.corr==='end'&&(r.corrections||[]).length?`<h3>${esc(t('corrections'))}</h3>`+r.corrections.map(c=>`<div class="corr"><s>${esc(c.original)}</s> → <b>${esc(c.corrected)}</b><br>${esc(c.explanation)}</div>`).join(''):'')
   +(props.length?`<h3>${esc(t('memProposals'))}</h3>`+props.map((p,i)=>`<label class="sw" style="margin:0"><span>${esc(p)}</span><input type="checkbox" data-p="${i}" checked></label>`).join(''):'')
   +`<div class="row" style="margin-top:12px"><button id="m-ok" style="flex:1">${esc(props.length?t('saveSel'):t('close'))}</button></div>`);
  h.querySelector('#m-ok').onclick=async()=>{
   for(const cb of h.querySelectorAll('[data-p]'))if(cb.checked)await addMemory(props[+cb.dataset.p],s.lang);
   closeModal();
  };
 }
 if(pf.sessCount%5===0&&S.key)assessLevel(s.lang).catch(()=>{});
 curSid=null;go('home');
}
async function addMemory(text,lang){
 text=String(text||'').trim();lang=lang||S.active;if(!text)return;
 const mine=async()=>(await dbAll('memory')).filter(m=>m.lang===lang).sort((a,b)=>a.id-b.id);
 let all=await mine();
 if(all.some(m=>m.text.toLowerCase()===text.toLowerCase()))return;
 await dbPut('memory',{lang,text:text.slice(0,200),ts:Date.now()});
 all=await mine();
 while(all.length>20){await dbDel('memory',all.shift().id)}
}

 const vl=[...new Set([S.native,...S.targets])];

 <label>${esc(t('setTargets'))}</label><div>${CODES.map(c=>`<label class="sw" style="margin:0"><span>${esc(LANGS[c].native)}</span><input type="checkbox" data-tg="${c}"${S.targets.includes(c)?' checked':''}></label>`).join('')}</div>

 </div>
 <div class="card" style="border-color:var(--ac)"><b>${esc(t('setProfile'))}: ${esc(LANGS[S.active].native)}</b>
 <label>${esc(t('setLevel'))}</label><select data-pk="level">${Object.keys(EQUIV).map(l=>`<option${l===P().level?' selected':''}>${l}</option>`).join('')}</select>
 <label>${esc(t('setGoal'))}</label><input data-pk="goal" value="${esc(P().goal)}" maxlength="120">
 <label>${esc(t('setDaily'))}</label><input type="number" min="1" max="240" data-pk="daily" value="${P().daily}"></div>
 <div class="card"><label style="margin-top:0">${esc(t('setApi'))}</label><input type="password" data-k="key" value="${esc(S.key)}" autocomplete="off" placeholder="AIza…"><div class="mut" style="margin-top:4px">${esc(t('apiHelp'))}</div>
 <label>${esc(t('setModel'))}</label><select data-k="model">${['gemini-3.5-flash-lite','gemini-3.6-flash','gemini-3.8-flash'].map(m=>`<option${m===S.model?' selected':''}>${m}</option>`).join('')}</select>
 <label>${esc(t('setTemp'))}: <span id="tv">${S.temp}</span></label><input type="range" min="0" max="1.5" step="0.1" data-k="temp" value="${S.temp}"></div>
 <div class="card"><label style="margin-top:0">${esc(t('setRate'))}: <span id="rv">${S.rate}x</span></label><input type="range" min="0.5" max="2" step="0.1" data-k="rate" value="${S.rate}">
 ${vl.map(c=>`<label>${esc(t('setVoice'))} · ${esc(LANGS[c].native)}</label><select data-v="${c}"><option value="">${esc(t('defVoice'))}</option>${voicesFor(c).map(v=>`<option value="${esc(v.name)}"${S.voices[c]===v.name?' selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select>`).join('')}
 ${[['autoRead','setAutoRead'],['showRead','setReading'],['showTrans','setTrans'],['autoSend','setAutoSend']].map(([k,l])=>`<label class="sw"><span>${esc(t(l))}</span><input type="checkbox" data-b="${k}"${S[k]?' checked':''}></label>`).join('')}</div>
 <div class="card"><b>${esc(t('memTitle'))} · ${esc(LANGS[S.active].native)}</b><div id="mem" style="margin-top:8px">${mem.map(m=>`<label class="li"><input type="checkbox" data-mid="${m.id}" style="width:auto"><span class="gr">${esc(m.text)}</span></label>`).join('')}</div>
 <div class="row"><input id="mem-new" placeholder="${esc(t('memHint'))}" style="flex:1" maxlength="200"><button id="mem-add">${esc(t('memAdd'))}</button></div>
 <div class="row" style="margin-top:8px"><button class="sec sm" id="mem-ds">${esc(t('delSel'))}</button><button class="danger sm" id="mem-da">${esc(t('delAll'))}</button></div></div>
 <div class="card"><button class="sec" id="x-exp" style="width:100%">${esc(t('expAll'))}</button><div class="mut" style="margin:4px 0 10px">${esc(t('expNote'))}</div>
 <button class="sec" id="x-imp" style="width:100%">${esc(t('impAll'))}</button><input type="file" id="x-file" accept="application/json" style="display:none"></div>

 el.querySelectorAll('[data-k]').forEach(i=>i.onchange=i.oninput=()=>{
  const k=i.dataset.k;let v=i.value;if(i.type==='number'||i.type==='range')v=parseFloat(v)||DEF[k];
  S[k]=v;if(k==='temp')$('tv').textContent=v;if(k==='rate')$('rv').textContent=v+'x';
  if(k==='key'&&v)S.welcomed=true;saveS();
  if(i.tagName==='SELECT'&&(k==='ui'||k==='native'||k==='active')){if(k==='ui')applyI18n();renderSettings()}
  if(k==='active'||k==='level'){}
 });
 el.querySelectorAll('[data-pk]').forEach(i=>i.onchange=i.oninput=()=>{const k=i.dataset.pk;let v=i.value;if(k==='daily')v=Math.max(1,parseInt(v)||15);P()[k]=v;saveS()});
 el.querySelectorAll('[data-tg]').forEach(i=>i.onchange=()=>{
  const c=i.dataset.tg;S.targets=i.checked?[...new Set([...S.targets,c])]:S.targets.filter(x=>x!==c);
  if(!S.targets.length){S.targets=[c];i.checked=true}
  if(!S.targets.includes(S.active))S.active=S.targets[0];saveS();renderSettings();
 });
 el.querySelectorAll('[data-v]').forEach(i=>i.onchange=()=>{S.voices[i.dataset.v]=i.value;saveS()});

 $('mem-add').onclick=async()=>{await addMemory($('mem-new').value,S.active);renderSettings()};
 const sel=()=>[...el.querySelectorAll('[data-mid]:checked')].map(i=>+i.dataset.mid);
 $('mem-ds').onclick=async()=>{for(const id of sel())await dbDel('memory',id);renderSettings()};

async function exportAll(){
 const out={app:'polyglot-ai',version:1,date:new Date().toISOString(),settings:Object.assign({},S,{key:''})};
 for(const s of STORES)out[s]=await dbAll(s);
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
 a.download=`polyglot-ai-${todayISO()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function importAll(f){
 if(!f)return;
 try{
  const d=JSON.parse(await f.text());if(d.app!=='polyglot-ai')throw new Error('Invalid file');
  if(!confirm(t('confirm')))return;
  for(const s of STORES){await dbClear(s);for(const o of d[s]||[])await dbPut(s,o)}
  const key=S.key;S=Object.assign(JSON.parse(JSON.stringify(DEF)),d.settings||{},{key});migrateSettings();saveS();await migrateDB();applyI18n();toast(t('imported'));curSid=null;go('settings');
 }catch(e){toast(t('error')+e.message,5000)}
}

/* ===== DELETE ALL DATA ===== */
function wipeAll(){
 const h=modal(`<h2>⚠️ ${esc(t('delData'))}</h2><p style="line-height:1.5">${esc(t('delDataWarn'))}</p><label class="sw"><span>${esc(t('keepKeyChk'))}</span><input type="checkbox" id="w-key" checked></label><div class="row" style="margin-top:12px"><button class="sec" id="w-no" style="flex:1">${esc(t('cancel'))}</button><button class="danger" id="w-yes" style="flex:1">${esc(t('delEverything'))}</button></div>`);
 h.querySelector('#w-no').onclick=closeModal;
 h.querySelector('#w-yes').onclick=async()=>{
  const keep=h.querySelector('#w-key').checked,key=S.key;
  stopSpeak();stopListen();
  for(const st of STORES)await dbClear(st);
  S=JSON.parse(JSON.stringify(DEF));if(keep)S.key=key;
  try{localStorage.removeItem('pl_settings')}catch(e){}
  saveS();curSid=null;closeModal();toast(t('deleted'));
  setTimeout(()=>{try{location.reload()}catch(e){}},700);
 };
}

/* ===== PWA INSTALL ===== */
let deferred=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function syncInstallBtns(){
 const show=!!deferred&&!isStandalone();
 ['btn-install','h-inst','s-inst'].forEach(id=>{const b=$(id);if(!b)return;b.style.display=show?'':'none';b.textContent='⬇ '+t('install');b.onclick=doInstall});
}
async function doInstall(){if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;syncInstallBtns()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;syncInstallBtns()});
window.addEventListener('appinstalled',()=>{deferred=null;syncInstallBtns()});
function showUninstall(){const h=modal(`<h2>${esc(t('uninstallHow'))}</h2><p style="line-height:1.5">${esc(t('uninstallTxt'))}</p><button id="mc" style="margin-top:12px;width:100%">${esc(t('close'))}</button>`);h.querySelector('#mc').onclick=closeModal}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

 document.querySelectorAll('nav [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 $('btn-sessions').onclick=showSessions;
 $('btn-newsess').onclick=()=>go('home');
 $('btn-end').onclick=endSession;
 $('btn-stop').onclick=()=>{stopSpeak();stopListen()};

 $('btn-hf').onclick=()=>{S.hf=!S.hf;saveS();updTools();if(S.hf&&curSid)startMic(true);else stopListen()};
 $('mic').onclick=()=>{if(listening)return stopListen();if(!curSid)return toast(t('startChat'));emptyTries=0;startMic()};
 $('send').onclick=()=>send($('inp').value);

 go(S.key?'home':'settings');
 if(!S.key)toast(t('welcome'),5000);
}

if(!window.__PL_TEST)init();
